services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-archio}
      POSTGRES_USER: ${DB_USERNAME:-archio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archio_local_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USERNAME:-archio}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:-rabbitmq_local_password}
    ports:
      - "127.0.0.1:${BROKER_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-archio_user}
      DB_PASSWORD: ${DB_PASSWORD:-archio_local_password}
      DB_DATABASE: ${DB_DATABASE:-archio}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
      BROKER_HOST: rabbitmq
      BROKER_PORT: "5672"
      BROKER_USERNAME: ${BROKER_USERNAME:-archio}
      BROKER_PASSWORD: ${BROKER_PASSWORD:-rabbitmq_local_password}
      STORAGE_PATH: /data/objects
      PUBLIC_BASE_URL: http://127.0.0.1:${APP_PORT:-3000}
      ROOT_USERNAME: ${ROOT_USERNAME:-}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
    volumes:
      - object_data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  object_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
